<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510">
<title>Spatial resolution: 10 metre and 30 metre satellite pixels</title><desc>The same 30 by 30 metre landscape represented by nine 10 metre pixels and one 30 metre pixel. All elements remain editable.</desc>
<rect width="1100" height="510" fill="#fbfcfa"/><g font-family="Arial,Helvetica,sans-serif" fill="#24313a"><text x="55" y="60" font-size="32" font-weight="bold">What does a satellite pixel measure?</text><text x="55" y="92" font-size="19" fill="#57666a">Two views of exactly the same 30 × 30 m area</text></g>
<g transform="translate(95 137)"><rect width="305" height="305" fill="#c8d6bb"/><path d="M18 28L289 28L289 55L18 55Z" fill="#c2b5a0"/><rect x="42" y="78" width="124" height="106" rx="3" fill="#83959c"/><path d="M35 82L103 47L173 82" fill="#647984"/><rect x="202" y="95" width="70" height="150" fill="#a1c487"/><circle cx="237" cy="170" r="26" fill="#5b936c"/><circle cx="263" cy="226" r="19" fill="#5b936c"/><path d="M0 102H305M0 203H305M102 0V305M203 0V305" stroke="#fff" stroke-width="3" stroke-opacity=".9"/><rect width="305" height="305" fill="none" stroke="#58726a" stroke-width="2"/></g>
<g transform="translate(690 137)"><rect width="305" height="305" fill="#c8d6bb"/><path d="M18 28L289 28L289 55L18 55Z" fill="#c2b5a0"/><rect x="42" y="78" width="124" height="106" rx="3" fill="#83959c"/><path d="M35 82L103 47L173 82" fill="#647984"/><rect x="202" y="95" width="70" height="150" fill="#a1c487"/><circle cx="237" cy="170" r="26" fill="#5b936c"/><circle cx="263" cy="226" r="19" fill="#5b936c"/><rect width="305" height="305" fill="#a3b4a5" opacity=".62"/><rect width="305" height="305" fill="none" stroke="#58726a" stroke-width="3"/></g>
<g font-family="Arial,Helvetica,sans-serif" fill="#24313a" text-anchor="middle"><text x="247" y="470" font-size="23" font-weight="bold">10 m pixels</text><text x="842" y="470" font-size="23" font-weight="bold">30 m pixel</text><text x="543" y="287" font-size="22" fill="#647984">Same place</text><path d="M431 310H653" stroke="#647984" stroke-width="2"/><path d="M653 310l-12 -7v14Z" fill="#647984"/></g></svg>