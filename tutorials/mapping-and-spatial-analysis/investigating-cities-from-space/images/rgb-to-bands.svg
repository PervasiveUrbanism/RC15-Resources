<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540">
<title>From RGB channels to multispectral satellite bands</title><desc>An RGB image comprises three channel layers, while a multispectral satellite measures additional wavelengths including near infrared.</desc><rect width="1100" height="540" fill="#fbfcfa"/><g font-family="Arial,Helvetica,sans-serif"><text x="54" y="58" font-size="32" font-weight="bold" fill="#24313a">From RGB channels to satellite bands</text><text x="54" y="92" font-size="19" fill="#64727a">A satellite records separate grayscale measurements — including light we cannot see</text>
<text x="80" y="156" font-size="23" font-weight="bold" fill="#24313a">Ordinary colour image</text>
<text x="665" y="156" font-size="23" font-weight="bold" fill="#24313a">Sentinel-2 multispectral image</text>
<g transform="translate(62 196)"><rect x="0" y="0" width="128" height="183" rx="5" fill="#d65d60"/><rect x="15" y="15" width="98" height="153" fill="#f8dada" opacity=".65"/><text x="64" y="215" text-anchor="middle" font-size="20" fill="#24313a">Red</text><rect x="144" y="0" width="128" height="183" rx="5" fill="#4d997e"/><rect x="159" y="15" width="98" height="153" fill="#dcf3e8" opacity=".65"/><text x="208" y="215" text-anchor="middle" font-size="20" fill="#24313a">Green</text><rect x="288" y="0" width="128" height="183" rx="5" fill="#5686bd"/><rect x="303" y="15" width="98" height="153" fill="#e0eafd" opacity=".65"/><text x="352" y="215" text-anchor="middle" font-size="20" fill="#24313a">Blue</text></g>
<path d="M514 276h86m-14 -11l14 11 -14 11" fill="none" stroke="#647984" stroke-width="3"/><text x="557" y="258" text-anchor="middle" font-size="15" fill="#647984">extend</text>
<g transform="translate(645 196)"><rect width="91" height="183" rx="5" fill="#5686bd"/><rect x="104" width="91" height="183" rx="5" fill="#4d997e"/><rect x="208" width="91" height="183" rx="5" fill="#d65d60"/><rect x="312" width="91" height="183" rx="5" fill="#8b69ac"/><g fill="#fff" font-size="18" text-anchor="middle" font-weight="bold"><text x="45" y="85">B2</text><text x="149" y="85">B3</text><text x="253" y="85">B4</text><text x="357" y="85">B8</text></g><g fill="#24313a" font-size="17" text-anchor="middle"><text x="45" y="214">Blue</text><text x="149" y="214">Green</text><text x="253" y="214">Red</text><text x="357" y="214">NIR</text></g><path d="M311 237h94" stroke="#8b69ac" stroke-width="3"/><text x="357" y="266" font-size="16" text-anchor="middle" fill="#644780">Invisible to our eyes</text></g>
<text x="55" y="490" font-size="18" fill="#57666a">Each band stores a measurement for each pixel. Other Sentinel-2 bands include red-edge and shortwave infrared.</text></g></svg>