<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f9faf9"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263238}.title{font-size:31px;font-weight:bold}.sub{font-size:18px;fill:#5c6970}.label{font-size:20px;font-weight:bold}.small{font-size:16px}.fine{font-size:14px;fill:#5c6970}.line{stroke:#51636a;stroke-width:3;fill:none}</style><text x="64" y="64" class="title">One shared question, four independent assessments</text><text x="64" y="98" class="sub">Round 0 — separate instructions and histories; no agent sees another agent's response</text><rect x="320" y="126" width="560" height="90" rx="12" fill="#eef3f0" stroke="#bac6c6" stroke-width="2"/><text class="label" x="340" y="165">Shared question + background</text><text class="small" x="340" y="202">Exactly the same input for all four roles</text><path class="line" d="M600 216 L172 278"/><path d="M172 278 l-9 -6 l0 12 z" fill="#51636a"/><rect x="40" y="278" width="272" height="166" rx="12" fill="#ffffff" stroke="#bac6c6" stroke-width="2"/><text class="label" x="60" y="317">Urban planner</text><text class="small" x="60" y="354">Land use · governance</text><text class="small" x="60" y="381">Own instructions and history</text><rect x="40" y="466" width="272" height="69" rx="12" fill="#edf3f7" stroke="#bac6c6" stroke-width="2"/><text class="label" x="60" y="505">Assessment 1</text><path class="line" d="M600 216 L468 278"/><path d="M468 278 l-9 -6 l0 12 z" fill="#51636a"/><rect x="336" y="278" width="272" height="166" rx="12" fill="#ffffff" stroke="#bac6c6" stroke-width="2"/><text class="label" x="356" y="317">Urban ecologist</text><text class="small" x="356" y="354">Habitat · urban climate</text><text class="small" x="356" y="381">Own instructions and history</text><rect x="336" y="466" width="272" height="69" rx="12" fill="#edf3f7" stroke="#bac6c6" stroke-width="2"/><text class="label" x="356" y="505">Assessment 2</text><path class="line" d="M600 216 L764 278"/><path d="M764 278 l-9 -6 l0 12 z" fill="#51636a"/><rect x="632" y="278" width="272" height="166" rx="12" fill="#ffffff" stroke="#bac6c6" stroke-width="2"/><text class="label" x="652" y="317">Housing researcher</text><text class="small" x="652" y="354">Need · affordability</text><text class="small" x="652" y="381">Own instructions and history</text><rect x="632" y="466" width="272" height="69" rx="12" fill="#edf3f7" stroke="#bac6c6" stroke-width="2"/><text class="label" x="652" y="505">Assessment 3</text><path class="line" d="M600 216 L1060 278"/><path d="M1060 278 l-9 -6 l0 12 z" fill="#51636a"/><rect x="928" y="278" width="272" height="166" rx="12" fill="#ffffff" stroke="#bac6c6" stroke-width="2"/><text class="label" x="948" y="317">Urban historian</text><text class="small" x="948" y="354">Memory · preservation</text><text class="small" x="948" y="381">Own instructions and history</text><rect x="928" y="466" width="272" height="69" rx="12" fill="#edf3f7" stroke="#bac6c6" stroke-width="2"/><text class="label" x="948" y="505">Assessment 4</text><text class="fine" x="64" y="579">These are analytical roles, not representatives of real stakeholders.</text></svg>