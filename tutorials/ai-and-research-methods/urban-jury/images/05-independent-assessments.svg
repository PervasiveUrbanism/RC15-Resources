<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f9faf9"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263238}.title{font-size:31px;font-weight:bold}.sub{font-size:18px;fill:#5c6970}.label{font-size:20px;font-weight:bold}.small{font-size:16px}.fine{font-size:14px;fill:#5c6970}.line{stroke:#51636a;stroke-width:3;fill:none}</style><text x="64" y="64" class="title">Independent assessments</text><text x="64" y="98" class="sub">The same question can produce different research priorities</text><rect x="40" y="150" width="272" height="300" rx="12" fill="#f1f6f2" stroke="#bac6c6" stroke-width="2"/><text class="label" x="60" y="189">Urban planner</text><text class="small" x="60" y="226">Land use · governance</text><text class="small" x="60" y="253">What evidence is needed?</text><text class="small" x="60" y="280">Which assumptions are weak?</text><text class="small" x="60" y="307">What alternatives exist?</text><text class="small" x="60" y="334"></text><text class="small" x="60" y="361">Output: saved argument</text><text class="small" x="60" y="388">and unanswered questions</text><rect x="336" y="150" width="272" height="300" rx="12" fill="#f5f7f9" stroke="#bac6c6" stroke-width="2"/><text class="label" x="356" y="189">Urban ecologist</text><text class="small" x="356" y="226">Habitat · urban climate</text><text class="small" x="356" y="253">What evidence is needed?</text><text class="small" x="356" y="280">Which assumptions are weak?</text><text class="small" x="356" y="307">What alternatives exist?</text><text class="small" x="356" y="334"></text><text class="small" x="356" y="361">Output: saved argument</text><text class="small" x="356" y="388">and unanswered questions</text><rect x="632" y="150" width="272" height="300" rx="12" fill="#f1f6f2" stroke="#bac6c6" stroke-width="2"/><text class="label" x="652" y="189">Housing researcher</text><text class="small" x="652" y="226">Need · affordability</text><text class="small" x="652" y="253">What evidence is needed?</text><text class="small" x="652" y="280">Which assumptions are weak?</text><text class="small" x="652" y="307">What alternatives exist?</text><text class="small" x="652" y="334"></text><text class="small" x="652" y="361">Output: saved argument</text><text class="small" x="652" y="388">and unanswered questions</text><rect x="928" y="150" width="272" height="300" rx="12" fill="#f5f7f9" stroke="#bac6c6" stroke-width="2"/><text class="label" x="948" y="189">Urban historian</text><text class="small" x="948" y="226">Memory · preservation</text><text class="small" x="948" y="253">What evidence is needed?</text><text class="small" x="948" y="280">Which assumptions are weak?</text><text class="small" x="948" y="307">What alternatives exist?</text><text class="small" x="948" y="334"></text><text class="small" x="948" y="361">Output: saved argument</text><text class="small" x="948" y="388">and unanswered questions</text><rect x="240" y="483" width="720" height="68" rx="12" fill="#f6f3e9" stroke="#bac6c6" stroke-width="2"/><text class="label" x="260" y="522">Compare, but do not combine</text><text class="small" x="260" y="559">Record overlaps, disagreements, unsupported claims</text><text class="fine" x="64" y="579">Illustrative output categories — not a screenshot of an actual run.</text></svg>