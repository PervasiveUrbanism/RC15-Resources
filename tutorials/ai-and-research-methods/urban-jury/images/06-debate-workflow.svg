<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f9faf9"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263238}.title{font-size:31px;font-weight:bold}.sub{font-size:18px;fill:#5c6970}.label{font-size:20px;font-weight:bold}.small{font-size:16px}.fine{font-size:14px;fill:#5c6970}.line{stroke:#51636a;stroke-width:3;fill:none}</style><text x="64" y="64" class="title">Fixed-round debate</text><text x="64" y="98" class="sub">Messages only flow between rounds through completed snapshots</text><rect x="36" y="155" width="240" height="185" rx="12" fill="#f1f6f2" stroke="#bac6c6" stroke-width="2"/><text class="label" x="56" y="194">Round 0</text><text class="small" x="56" y="231">Four independent answers</text><text class="small" x="56" y="258">R0–A1 to R0–A4</text><text class="small" x="56" y="285"></text><text class="small" x="56" y="312">No shared messages</text><path class="line" d="M280 248 L365 248"/><path d="M365 248 l-9 -6 l0 12 z" fill="#51636a"/><rect x="365" y="185" width="195" height="125" rx="12" fill="#fff7e9" stroke="#bac6c6" stroke-width="2"/><text class="label" x="385" y="224">Snapshot 0</text><text class="small" x="385" y="261">All four R0 answers</text><text class="small" x="385" y="288">Frozen input</text><path class="line" d="M560 248 L646 248"/><path d="M646 248 l-9 -6 l0 12 z" fill="#51636a"/><rect x="646" y="155" width="240" height="185" rx="12" fill="#f1f6f2" stroke="#bac6c6" stroke-width="2"/><text class="label" x="666" y="194">Round 1</text><text class="small" x="666" y="231">Each sees snapshot 0</text><text class="small" x="666" y="258">and own history</text><text class="small" x="666" y="285">Four new answers</text><path class="line" d="M766 340 L766 404"/><path d="M766 404 l-9 -6 l0 12 z" fill="#51636a"/><rect x="662" y="410" width="210" height="100" rx="12" fill="#fff7e9" stroke="#bac6c6" stroke-width="2"/><text class="label" x="682" y="449">Snapshot 1</text><text class="small" x="682" y="486">All four R1 answers</text><path class="line" d="M660 460 L549 460"/><path d="M549 460 l-9 -6 l0 12 z" fill="#51636a"/><rect x="300" y="406" width="240" height="110" rx="12" fill="#f1f6f2" stroke="#bac6c6" stroke-width="2"/><text class="label" x="320" y="445">Round 2</text><text class="small" x="320" y="482">Each sees snapshot 1</text><text class="small" x="320" y="509">and own history</text><path class="line" d="M300 460 L196 460"/><path d="M196 460 l-9 -6 l0 12 z" fill="#51636a"/><rect x="36" y="410" width="150" height="100" rx="12" fill="#eaf0f6" stroke="#bac6c6" stroke-width="2"/><text class="label" x="56" y="449">Moderator</text><text class="small" x="56" y="486">Reads full record</text><text class="fine" x="64" y="579">No agent sees an unfinished response from the same round; moderator follows completed discussion.</text></svg>